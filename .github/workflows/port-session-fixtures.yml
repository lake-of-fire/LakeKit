name: Port session fixture regressions
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: session-port-${{ github.ref }}
  cancel-in-progress: true
jobs:
  session:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2.1'
      - name: Test actual Session and credential repository
        shell: bash
        run: |
          set -o pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/tested-commit.txt
          git ls-tree -r HEAD > evidence/source-manifest.txt
          swift --version > evidence/toolchain.txt
          export SESSION_PORT_EVIDENCE_DIRECTORY="$PWD/evidence"
          bash Tools/test-session-port.sh -c debug 2>&1 | tee evidence/test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-port-debug-${{ github.run_attempt }}
          path: evidence
          retention-days: 7
          if-no-files-found: error
